name: "Minecraft Vanilla Dedicated Server"
slug: minecraft_vanilla_server
description: >
  Minecraft Dedicated Server for Home Assistant OS.
  Runs vanilla or a CurseForge modpack. Automatically installs Java,
  accepts the Minecraft EULA, downloads the selected server version
  and stores all data persistently in /share.
version: "0.0.11"

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false
host_network: false

# Container always runs on 25565
# The host port can be changed in the HA UI
ports:
  25565/tcp: 25565
  25575/tcp: 25575

ports_description:
  25565/tcp: "Minecraft server port (container fixed to 25565)"
  25575/tcp: "Minecraft RCON port"

map:
  - share:rw

options:
  data_dir: "/share/minecraft-vanilla"

  # RAM (MB)
  xms_mb: 4096
  xmx_mb: 8192

  # Java version (e.g. 17, 21, 25) - must match the Minecraft / modpack version
  java_version: "25"

  # "latest" or e.g. "1.21.1" (vanilla only, or fallback for modpacks without manifest.json)
  mc_version: "latest"

  # Optional: fixed server JAR URL (overrides mc_version, vanilla only)
  server_jar_url: ""

  # Optional: direct link to a modpack ZIP (server pack or client pack).
  # Overrides mc_version and server_jar_url. Leave empty for vanilla.
  modpack_url: ""

  # Optional: free CurseForge API key (https://console.curseforge.com).
  # Only needed for client packs, to download the mods listed in manifest.json.
  curseforge_api_key: ""

schema:
  data_dir: str
  xms_mb: int
  xmx_mb: int
  java_version: str
  mc_version: str
  server_jar_url: str?
  modpack_url: str?
  curseforge_api_key: password?
